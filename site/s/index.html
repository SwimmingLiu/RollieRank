<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>卷卷小榜 · 行测估分工具</title>
    <meta name="description" content="行测估分、算分、判分、对答案工具。录入答题卡自动出分，看板块得分率和同卷排名。" />
    <link rel="canonical" href="https://rank.swimmingliu.cn/" />
    <meta name="theme-color" content="#fcf8f1" />
    <!-- 短链页不进索引，避免和首页重复 -->
    <meta name="robots" content="noindex, follow" />

    <link rel="icon" href="https://rollie-rank-oss.swimmingliu.cn/static/rollierank-site/logo-64.png" type="image/png" />
    <link rel="stylesheet" href="/styles.css" />

    <style>
      .shortlink {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px 48px;
      }
      .shortlink__card {
        width: min(420px, 100%);
        background: var(--surface, #fffdf8);
        border: 1px solid var(--line, #e7dece);
        border-radius: 22px;
        padding: 26px 22px 20px;
        text-align: center;
        box-shadow: 0 18px 60px rgba(48, 43, 41, 0.10);
      }
      .shortlink__card h1 {
        font-size: 20px;
        line-height: 1.45;
        margin: 12px 0 6px;
        font-weight: 640;
      }
      .shortlink__card p {
        color: var(--muted, #79767d);
        font-size: 14px;
        line-height: 1.65;
        margin: 0 0 14px;
      }
      .shortlink__mark {
        width: 48px; height: 48px;
        border-radius: 14px;
        display: inline-block;
      }
      .shortlink__code {
        display: flex;
        justify-content: center;
        padding: 6px 0 10px;
      }
      .shortlink__code img {
        width: 216px; height: 216px;
        border-radius: 14px;
        border: 1px solid var(--line, #e7dece);
        background: #fff;
        padding: 8px;
        box-sizing: border-box;
      }
      .shortlink__hint {
        color: var(--muted, #79767d);
        font-size: 13.5px;
        line-height: 1.6;
        margin: 0 0 14px;
      }
      .shortlink__cta {
        display: inline-block;
        background: var(--ink, #302b29);
        color: #fff;
        text-decoration: none;
        padding: 11px 22px;
        border-radius: 999px;
        font-size: 15px;
        margin: 4px 0 10px;
      }
      .shortlink__cta:hover { color: #fff; background: #443b38; }
      .shortlink__error {
        color: #b87569;
        font-size: 14px;
        margin-top: 10px;
      }
      .shortlink__loading { color: var(--muted, #79767d); font-size: 14px; }
    </style>
  </head>

  <body>
    <main class="shortlink">
      <div class="shortlink__card" id="card">
        <img class="shortlink__mark" src="https://rollie-rank-oss.swimmingliu.cn/static/rollierank-site/logo-256.png" alt="卷卷小榜" width="48" height="48" />
        <h1 id="title">卷卷小榜</h1>
        <p id="subtitle">行测估分工具：录入答题卡自动出分，看板块得分率和同卷排名。</p>
        <div class="shortlink__code" id="codeBox" hidden></div>
        <p class="shortlink__hint" id="hint" hidden></p>
        <p class="shortlink__loading" id="loading">正在加载…</p>
        <p class="shortlink__error" id="error" hidden></p>
        <a class="shortlink__cta" id="cta" href="/" hidden>了解卷卷小榜</a>
      </div>
    </main>

    <script>
      (function () {
        var WECHAT = /MicroMessenger/i;
        var MOBILE = /Android|iPhone|iPad|iPod|Mobile|HarmonyOS|OpenHarmony/i;
        var inWeChat = WECHAT.test(navigator.userAgent || "");
        var isMobile = MOBILE.test(navigator.userAgent || "");

        var els = {
          title: document.getElementById("title"),
          subtitle: document.getElementById("subtitle"),
          codeBox: document.getElementById("codeBox"),
          hint: document.getElementById("hint"),
          loading: document.getElementById("loading"),
          error: document.getElementById("error"),
          cta: document.getElementById("cta"),
        };

        // 短码来自路径 /s/<code>；nginx 用 try_files 把任意 /s/* 都兜到这个页面。
        function readCode() {
          var m = /^\/s\/([a-z0-9]+)\/?$/i.exec(location.pathname);
          return m ? m[1].toLowerCase() : "";
        }

        function show(text) {
          els.loading.hidden = true;
          els.error.hidden = true;
          els.error.textContent = text;
          els.error.hidden = false;
        }

        function render(link) {
          els.loading.hidden = true;
          if (link.title) els.title.textContent = link.title;
          var box = document.createElement("img");
          box.alt = "卷卷小榜小程序码";
          box.width = 216;
          box.height = 216;
          box.src = "data:" + (link.mime || "image/jpeg") + ";base64," + link.image;
          els.codeBox.appendChild(box);
          els.codeBox.hidden = false;

          els.hint.textContent = inWeChat
            ? "长按上方小程序码，选择「前往图中包含的小程序」。"
            : "长按或截屏保存小程序码，在微信里扫一扫即可打开。";
          els.hint.hidden = false;

          if (!isMobile) {
            els.subtitle.textContent = "用手机微信扫下方小程序码，或直接打开网页版。";
            els.cta.href = "https://rollie-rank.swimmingliu.cn/ios-v3/app.html";
            els.cta.textContent = "打开网页版";
            els.cta.hidden = false;
          } else {
            els.cta.href = "/";
            els.cta.textContent = "看看卷卷小榜是什么";
            els.cta.hidden = false;
          }
        }

        function load() {
          var code = readCode();
          if (!code) { show("这个短链地址不完整。"); return; }
          // visit=1 记一次点击；二维码单独拉取，命中服务端 24h 缓存。
          fetch("/api/links/" + encodeURIComponent(code) + "?visit=1", { credentials: "omit" })
            .then(function (res) {
              return res.json().then(function (body) { return { status: res.status, body: body }; });
            })
            .then(function (result) {
              if (result.status !== 200 || !result.body || !result.body.enabled) {
                throw new Error((result.body && result.body.error) || "短链不存在或已过期。");
              }
              return result.body;
            })
            .then(function (link) {
              if (link.title) els.title.textContent = link.title;
              return fetch("/api/links/" + encodeURIComponent(code) + "/qrcode", { credentials: "omit" })
                .then(function (res) { return res.json(); })
                .then(function (qr) {
                  if (!qr || !qr.image) throw new Error((qr && qr.error) || "小程序码生成失败。");
                  render({ title: link.title, image: qr.image, mime: qr.mime });
                });
            })
            .catch(function (error) {
              show(error.message || "短链加载失败，请稍后重试。");
              els.cta.href = "/";
              els.cta.textContent = "回到首页";
              els.cta.hidden = false;
            });
        }

        load();
      })();
    </script>
  </body>
</html>
