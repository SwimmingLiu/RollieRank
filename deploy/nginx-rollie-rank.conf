limit_req_zone $binary_remote_addr zone=rr_admin_auth:10m rate=5r/m;

server
{
    listen 80;
    listen [::]:80;
    server_name rollie-rank.swimmingliu.cn;
    return 301 https://$host$request_uri;
}

server
{
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rollie-rank.swimmingliu.cn;

    ssl_certificate     /www/server/panel/vhost/cert/rollie-rank.swimmingliu.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/rollie-rank.swimmingliu.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";

    # 评论配图需要较大请求体，其余接口保持应用自身的 1 MB 限制。
    client_max_body_size 10m;
    client_body_timeout 90s;

    access_log /www/wwwlogs/rollie-rank.swimmingliu.cn.log;
    error_log /www/wwwlogs/rollie-rank.swimmingliu.cn.error.log;

    # 显式屏蔽常见默认后台路径，防止扫描器探测（真实入口由 ROLLIERANK_ADMIN_PATH 决定）。
    location ^~ /admin {
        return 404;
    }

    location ^~ /api/console/ {
        return 404;
    }

    # 将下方 <ROLLIERANK_ADMIN_PATH> 替换为与 /etc/rollierank.env 中一致的随机隐蔽路径（例如 rr-xxxxxxxxxxxx）。
    # 后台登录与初始化接口边缘层防爆破限流（每 IP 每分钟 5 次，突发 3 次，超限返回 429）。
    location ~ ^/<ROLLIERANK_ADMIN_PATH>/api/(login|setup)$ {
        limit_req zone=rr_admin_auth burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /<ROLLIERANK_ADMIN_PATH> {
        return 302 /<ROLLIERANK_ADMIN_PATH>/;
    }

    location /<ROLLIERANK_ADMIN_PATH>/ {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_connect_timeout 10s;
    }

    # 微信页面复用现有手机前端及公开模块，题库答案仍由 Node 服务隔离。
    location ^~ /src/data/ {
        return 404;
    }

    location ~ ^/(ios-v3|src)/ {
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host $host;
    }

    # 健康检查与根路径不暴露应用内部页面。
    location = /healthz {
        proxy_pass http://127.0.0.1:4173/api/catalog;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        return 404 '{"error":"not found"}';
        default_type application/json;
    }
}
