# Independent HTTPS entry for the RollieRank test instance.
# Native mini-program calls use the test API directly. Browser administration stays protected.
map $uri $rollierank_test_auth {
    default "RollieRank test";
    ~^/api/(?:catalog|sample|submit|attempts/(?:sync|delete))$ off;
    ~^/api/positions/(?:hierarchy|catalog|profile|selection|participation|withdraw|leaderboard|insights|public-result)$ off;
    ~^/api/discussions(?:/(?:replies|like|media))?$ off;
    ~^/api/corrections/(?:summary|submit|list|preview|admin|review)$ off;
    ~^/api/miniprogram-profile/(?:capabilities|session|profile|avatar)$ off;
    ~^/api/miniprogram-web/(?:bootstrap|redeem|action|listen|poster)$ off;
    ~^/api/tool-credits/(?:capabilities|login|wallet|quote|logout|invite/(?:code|visit))$ off;
    "~^/api/tool-credits/purchases(?:/RR[a-f0-9]{30}(?:/confirm)?)?$" off;
    ~^/api/wechat/sec-callback$ off;
}

# App sessions belong to the API. Keep the site's Basic credential at Nginx.
map "$rollierank_test_auth:$http_authorization" $rollierank_test_api_authorization {
    default "";
    "~*^off:Bearer [a-f0-9]{64}$" $http_authorization;
}

server {
    listen 80;
    listen [::]:80;
    server_name rollie-rank-test.swimmingliu.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/rollierank-test-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://rollie-rank-test.swimmingliu.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rollie-rank-test.swimmingliu.cn;

    ssl_certificate /etc/rollierank-test-web/tls/fullchain.pem;
    ssl_certificate_key /etc/rollierank-test-web/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    auth_basic $rollierank_test_auth;
    auth_basic_user_file /etc/rollierank-test-web/htpasswd;
    access_log /www/wwwlogs/rollie-rank-test.swimmingliu.cn.log;
    error_log /www/wwwlogs/rollie-rank-test.swimmingliu.cn.error.log;
    client_max_body_size 10m;
    client_body_timeout 90s;

    location / {
        proxy_pass http://127.0.0.1:4175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $rollierank_test_api_authorization;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }
}
